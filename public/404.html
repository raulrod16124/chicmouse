<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChicMouse Studio · 404</title>
    <meta name="robots" content="noindex" />
    <style media="screen">
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #1b2a55 0%, #0B132B 60%, #060b18 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #e6ebf5;
      }
      .card {
        text-align: center;
        padding: 48px 32px;
        max-width: 520px;
      }
      .card img { width: 120px; height: 120px; border-radius: 24px; margin-bottom: 24px; }
      .code {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: 6px;
        color: #f2c14e;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 16px;
      }
      p { font-size: 15px; line-height: 1.6; margin: 0 0 8px; color: #93a1c8; }
      p strong { color: #e6ebf5; font-weight: 600; }
      .lang { margin: 20px 0 32px; padding: 16px 20px; border: 1px dashed #33406b; border-radius: 12px; }
      a.home {
        display: inline-block;
        background: #f2c14e;
        color: #0B132B;
        font-weight: 700;
        text-decoration: none;
        padding: 14px 32px;
        border-radius: 999px;
      }
      a.home:hover { background: #ffd67d; }
      .footer { margin-top: 32px; font-size: 13px; color: #6b7aa5; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.webp" alt="ChicMouse Studio" />
      <p class="code">404</p>
      <div class="lang">
        <h1>Page not found</h1>
        <p>Oops — the page you were looking for is not here.</p>
        <p><strong>Página no encontrada</strong></p>
        <p>Vaya, la página que buscas no está aquí.</p>
      </div>
      <a class="home" href="/">Go home · Ir al inicio</a>
      <div class="footer">© ChicMouse Studio</div>
    </div>
  </body>
</html>
